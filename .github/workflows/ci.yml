name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests
      - run: bash -n scripts/profile_nsys.sh scripts/profile_ncu.sh
      - run: shellcheck scripts/profile_nsys.sh scripts/profile_ncu.sh
      - run: python generate_prompts.py --verify
      - run: python scripts/run_experiment.py --help
      - run: python scripts/analyze_roofline.py --help
